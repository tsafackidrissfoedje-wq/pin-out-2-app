<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>PIN OUT 2 Pro — Base Calculateurs & Schémas (3 747 calculateurs)</title>
  <meta name="description" content="Base de données professionnelle de brochages, schémas de connexion et calculateurs moteur (Bench, Boot, K-Tag, HexPortal, DM, CFPM GBE AUTO)">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0B1329;
      --card: #131D38;
      --card-hover: #1A284C;
      --panel: #0F1A36;
      --line: rgba(255, 255, 255, 0.08);
      --line-hover: rgba(56, 189, 248, 0.3);
      --blue: #38BDF8;
      --blue-deep: #0284C7;
      --yellow: #F59E0B;
      --green: #10B981;
      --purple: #A855F7;
      --text: #F8FAFC;
      --text-muted: #94A3B8;
      --text-faint: #64748B;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'IBM Plex Sans', -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(11, 19, 41, 0.95);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--line);
      padding: 12px 16px;
    }
    .top-row {
      max-width: 1000px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .logo-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .logo-badge {
      background: linear-gradient(135deg, var(--blue), var(--blue-deep));
      color: #FFF;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 15px;
      padding: 6px 10px;
      border-radius: 8px;
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.3);
    }
    .app-title h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 17px;
      font-weight: 700;
      color: var(--text);
      line-height: 1.2;
    }
    .app-title p {
      font-size: 11px;
      color: var(--text-muted);
    }
    .btn-apk {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: linear-gradient(135deg, #2563EB, #1D4ED8);
      color: #FFF;
      text-decoration: none;
      font-size: 12px;
      font-weight: 600;
      padding: 8px 14px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
      white-space: nowrap;
      transition: transform 0.1s;
    }
    .btn-apk:active { transform: scale(0.97); }
    .search-container {
      max-width: 1000px;
      margin: 10px auto 0;
      position: relative;
    }
    .search-input {
      width: 100%;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 12px 14px 12px 38px;
      color: var(--text);
      font-size: 14.5px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .search-input:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15);
    }
    .search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-faint);
      pointer-events: none;
    }
    .clear-search {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text-faint);
      font-size: 16px;
      cursor: pointer;
      display: none;
    }
    .filter-scroll {
      max-width: 1000px;
      margin: 10px auto 0;
      display: flex;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
      padding-bottom: 2px;
    }
    .filter-scroll::-webkit-scrollbar { display: none; }
    .chip {
      background: var(--panel);
      color: var(--text-muted);
      border: 1px solid var(--line);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 500;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.15s;
    }
    .chip.active {
      background: var(--blue);
      color: #071224;
      font-weight: 700;
      border-color: var(--blue);
    }
    main {
      flex: 1;
      max-width: 1000px;
      width: 100%;
      margin: 0 auto;
      padding: 16px;
    }
    .meta-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12.5px;
      color: var(--text-muted);
      margin-bottom: 12px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 10px;
    }
    .item-card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 14px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 6px;
      transition: all 0.15s;
      text-align: left;
    }
    .item-card:hover {
      background: var(--card-hover);
      border-color: var(--line-hover);
      transform: translateY(-1px);
    }
    .item-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    .badge-cat {
      font-size: 10.5px;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 5px;
      letter-spacing: 0.03em;
    }
    .cat-cfpm { background: rgba(245, 158, 11, 0.15); color: #FBBF24; border: 1px solid rgba(245, 158, 11, 0.3); }
    .cat-ktag { background: rgba(59, 130, 246, 0.15); color: #60A5FA; border: 1px solid rgba(59, 130, 246, 0.3); }
    .cat-bench { background: rgba(56, 189, 248, 0.15); color: #38BDF8; border: 1px solid rgba(56, 189, 248, 0.3); }
    .cat-boot { background: rgba(168, 85, 247, 0.15); color: #C084FC; border: 1px solid rgba(168, 85, 247, 0.3); }
    .cat-hex { background: rgba(16, 185, 129, 0.15); color: #34D399; border: 1px solid rgba(16, 185, 129, 0.3); }
    .cat-dm { background: rgba(236, 72, 153, 0.15); color: #F472B6; border: 1px solid rgba(236, 72, 153, 0.3); }
    .badge-mcu {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10.5px;
      color: var(--text-faint);
    }
    .item-title {
      font-size: 14.5px;
      font-weight: 600;
      color: var(--text);
      line-height: 1.35;
    }
    .item-summary {
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .item-footer {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 4px;
      font-size: 11px;
      color: var(--text-faint);
    }
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: rgba(3, 7, 18, 0.9);
      backdrop-filter: blur(8px);
      flex-direction: column;
    }
    .modal.open { display: flex; }
    .modal-header {
      background: var(--panel);
      border-bottom: 1px solid var(--line);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .modal-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .modal-close {
      background: #1E293B;
      border: 1px solid var(--line);
      color: var(--text);
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 18px;
    }
    .modal-body {
      flex: 1;
      overflow: auto;
      -webkit-overflow-scrolling: touch;
      position: relative;
    }
    .modal-frame {
      width: 100%;
      height: 100%;
      border: none;
      background: #0F172A;
    }
    .spinner {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 40px;
      height: 40px;
      border: 3px solid rgba(56, 189, 248, 0.2);
      border-top-color: var(--blue);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: translate(-50%, -50%) rotate(360deg); } }
  </style>
</head>
<body>
  <header>
    <div class="top-row">
      <div class="logo-wrap">
        <div class="logo-badge">PIN OUT 2</div>
        <div class="app-title">
          <h1>Base Calculateurs</h1>
          <p>3 747 calculateurs &amp; schémas interactifs</p>
        </div>
      </div>
      <a class="btn-apk" href="https://github.com/tsafackidrissfoedje-wq/pin-out-2-app/releases/tag/v2.0.0" target="_blank">
        📲 Télécharger l'App (APK)
      </a>
    </div>

    <div class="search-container">
      <span class="search-icon">🔍</span>
      <input type="text" id="searchInput" class="search-input" placeholder="Rechercher un calculateur, MCU, marque, référence..." autocomplete="off">
      <button id="clearBtn" class="clear-search">✕</button>
    </div>

    <div class="filter-scroll" id="categoryChips">
      <button class="chip active" data-cat="ALL">Tous (3 747)</button>
      <button class="chip" data-cat="cfpm_gbe_auto">CFPM GBE (934)</button>
      <button class="chip" data-cat="ktag_instruction">K-TAG (1 987)</button>
      <button class="chip" data-cat="pcmktm_bench_module71">Bench 71 (174)</button>
      <button class="chip" data-cat="bsl_bootmode_tricore">Boot / BSL (169)</button>
      <button class="chip" data-cat="hexportal_ecu_connections">HexPortal (299)</button>
      <button class="chip" data-cat="dm_bosch_siemens_marelli">DM Pinout (184)</button>
    </div>
  </header>

  <main>
    <div class="meta-bar">
      <span id="resultsCount">Chargement de la base de données...</span>
      <span id="loadingText"></span>
    </div>
    <div class="grid" id="resultsGrid"></div>
  </main>

  <div class="modal" id="detailModal">
    <div class="modal-header">
      <div class="modal-title" id="modalTitle">Schéma du calculateur</div>
      <button class="modal-close" id="modalClose">✕</button>
    </div>
    <div class="modal-body">
      <div class="spinner" id="modalSpinner"></div>
      <iframe class="modal-frame" id="modalFrame"></iframe>
    </div>
  </div>

  <script>
    (function() {
      let database = [];
      let currentCategory = 'ALL';
      let currentQuery = '';

      const searchInput = document.getElementById('searchInput');
      const clearBtn = document.getElementById('clearBtn');
      const resultsGrid = document.getElementById('resultsGrid');
      const resultsCount = document.getElementById('resultsCount');
      const categoryChips = document.getElementById('categoryChips');
      const detailModal = document.getElementById('detailModal');
      const modalClose = document.getElementById('modalClose');
      const modalTitle = document.getElementById('modalTitle');
      const modalFrame = document.getElementById('modalFrame');
      const modalSpinner = document.getElementById('modalSpinner');

      function getRepo(source, path) {
        if (path) {
          const p = path.toLowerCase();
          if (p.startsWith('assets/images') || p.includes('assets/images')) return 'pin-out-cfpm-gbe-auto-237';
          if (p.startsWith('bsl_bootmode_tricore') || p.startsWith('pcmktm_bench_module71') || p.startsWith('cfpm_pinouts')) return 'pin-out-2-bench-bsl';
          if (p.startsWith('dm_bosch_siemens_marelli') || p.startsWith('hexportal_ecu_connections')) return 'pin-out-2-hexportal-dm';
          if (p.startsWith('ktag_instruction')) return 'pin-out-2-ktag';
        }
        if (source === 'bsl_bootmode_tricore' || source === 'pcmktm_bench_module71' || source === 'cfpm_gbe_auto') return 'pin-out-2-bench-bsl';
        if (source === 'dm_bosch_siemens_marelli' || source === 'hexportal_ecu_connections') return 'pin-out-2-hexportal-dm';
        if (source === 'ktag_instruction') return 'pin-out-2-ktag';
        return 'pin-out-2-bench-bsl';
      }

      function getCatClass(source) {
        if (source === 'cfpm_gbe_auto') return 'cat-cfpm';
        if (source === 'ktag_instruction') return 'cat-ktag';
        if (source === 'pcmktm_bench_module71') return 'cat-bench';
        if (source === 'bsl_bootmode_tricore') return 'cat-boot';
        if (source === 'hexportal_ecu_connections') return 'cat-hex';
        return 'cat-dm';
      }

      function renderItems(items) {
        resultsCount.textContent = items.length + ' calculateurs trouvés';
        if (items.length === 0) {
          resultsGrid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:40px;color:#64748B;">Aucun calculateur correspondant trouvé.</div>';
          return;
        }
        const maxDisplay = 150;
        const slice = items.slice(0, maxDisplay);
        resultsGrid.innerHTML = slice.map(item => `
          <div class="item-card" onclick="openDetail(${item.id})">
            <div class="item-header">
              <span class="badge-cat ${getCatClass(item.source)}">${item.category}</span>
              <span class="badge-mcu">${(item.mcus && item.mcus[0]) || ''}</span>
            </div>
            <div class="item-title">${item.title}</div>
            <div class="item-summary">${item.summary || ''}</div>
            <div class="item-footer">
              ${item.images_count > 0 ? `<span>📷 ${item.images_count} image(s)</span>` : ''}
              ${item.brands && item.brands.length ? `<span>• ${item.brands.slice(0, 2).join(', ')}</span>` : ''}
            </div>
          </div>
        `).join('');
      }

      function applyFilter() {
        const q = currentQuery.toLowerCase().trim();
        const filtered = database.filter(item => {
          if (currentCategory !== 'ALL' && item.source !== currentCategory) return false;
          if (!q) return true;
          return (item.tags && item.tags.toLowerCase().includes(q)) ||
                 (item.title && item.title.toLowerCase().includes(q)) ||
                 (item.summary && item.summary.toLowerCase().includes(q));
        });
        renderItems(filtered);
      }

      window.openDetail = function(id) {
        const item = database.find(x => x.id === id);
        if (!item) return;

        modalTitle.textContent = item.title;
        modalSpinner.style.display = 'block';
        detailModal.classList.add('open');

        let cleanPath = item.html || '';
        if (cleanPath.startsWith('extracted/')) cleanPath = cleanPath.substring(10);
        while (cleanPath.startsWith('/')) cleanPath = cleanPath.substring(1);

        const repo = getRepo(item.source, cleanPath);
        const encodedPath = cleanPath.split('/').map(encodeURIComponent).join('/');
        const rawUrl = `https://raw.githubusercontent.com/tsafackidrissfoedje-wq/${repo}/main/${encodedPath}`;
        const cdnUrl = `https://cdn.jsdelivr.net/gh/tsafackidrissfoedje-wq/${repo}@main/${encodedPath}`;

        fetch(rawUrl)
          .catch(() => fetch(cdnUrl))
          .then(res => res.text())
          .then(html => {
            // Fix images
            let processed = html.replace(/<base[^>]*>/gi, '');
            processed = processed.replace(/(?:\.\.\/)+assets\/images\//gi, 'https://raw.githubusercontent.com/tsafackidrissfoedje-wq/pin-out-cfpm-gbe-auto-237/main/assets/images/');
            processed = processed.replace(/assets\/images\//gi, 'https://raw.githubusercontent.com/tsafackidrissfoedje-wq/pin-out-cfpm-gbe-auto-237/main/assets/images/');

            const css = `<style>
              body { background:#0F172A !important; color:#E2E8F0 !important; font-family:-apple-system,sans-serif !important; padding:14px !important; line-height:1.6 !important; }
              img { max-width:100% !important; height:auto !important; border-radius:10px !important; display:block !important; margin:14px auto !important; background:#1E293B !important; }
              table { width:100% !important; border-collapse:collapse !important; margin:14px 0 !important; background:#1E293B !important; border-radius:8px !important; overflow:hidden !important; border:1px solid #334155 !important; }
              th, td { padding:10px 12px !important; border:1px solid #334155 !important; font-size:13px !important; }
              th { background:#334155 !important; color:#38BDF8 !important; }
              .texter, div[id^='a'], div[id^='b'], div[id^='c'] { display:block !important; }
            </style><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">`;

            if (processed.includes('<head>')) {
              processed = processed.replace('<head>', '<head>' + css);
            } else {
              processed = css + processed;
            }

            modalFrame.srcdoc = processed;
            modalSpinner.style.display = 'none';
          })
          .catch(err => {
            modalSpinner.style.display = 'none';
            modalFrame.srcdoc = `<body style="background:#0F172A;color:#EF4444;font-family:sans-serif;padding:30px;text-align:center;"><h3>Erreur de chargement</h3><p>Impossible de charger le schéma depuis GitHub (${err.message})</p></body>`;
          });
      };

      modalClose.onclick = function() {
        detailModal.classList.remove('open');
        modalFrame.srcdoc = '';
      };

      searchInput.addEventListener('input', function(e) {
        currentQuery = e.target.value;
        clearBtn.style.display = currentQuery ? 'block' : 'none';
        applyFilter();
      });

      clearBtn.addEventListener('click', function() {
        searchInput.value = '';
        currentQuery = '';
        clearBtn.style.display = 'none';
        applyFilter();
      });

      categoryChips.addEventListener('click', function(e) {
        if (e.target.classList.contains('chip')) {
          document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
          e.target.classList.add('active');
          currentCategory = e.target.dataset.cat;
          applyFilter();
        }
      });

      // Load Index
      const localUrl = './pinout_app_index.json';
      const cdnIndexUrl = 'https://cdn.jsdelivr.net/gh/tsafackidrissfoedje-wq/pin-out-2-app@main/pinout_app_index.json';
      const rawIndexUrl = 'https://raw.githubusercontent.com/tsafackidrissfoedje-wq/pin-out-2-app/main/pinout_app_index.json';

      fetch(localUrl)
        .catch(() => fetch(cdnIndexUrl))
        .catch(() => fetch(rawIndexUrl))
        .then(res => res.json())
        .then(data => {
          database = data;
          applyFilter();
        })
        .catch(err => {
          resultsCount.textContent = 'Erreur lors du chargement de la base : ' + err.message;
        });
    })();
  </script>
</body>
</html>
