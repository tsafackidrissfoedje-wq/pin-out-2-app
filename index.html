<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>PIN OUT 2 — ECU & TCU Pinout Master Database (3 747 calculateurs)</title>
  <meta name="description" content="Application officielle PIN OUT 2 - Base de données calculateurs, schémas de connexion et brochages professionnels">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0B1329;
      --bg-card: #101E36;
      --bg-search: #13223D;
      --border-color: rgba(255, 255, 255, 0.09);
      --primary: #38BDF8;
      --primary-dark: #0284C7;
      --accent: #0EA5E9;
      --accent-orange: #F59E0B;
      --text-primary: #F8FAFC;
      --text-secondary: #94A3B8;
      --text-muted: #64748B;
      --chip-bg: #13223D;
      --chip-active-bg: #0284C7;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      background-color: var(--bg-dark);
      color: var(--text-primary);
      font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }
    #appContainer {
      max-width: 900px;
      margin: 0 auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* Header matching activity_main.xml */
    .app-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      padding-top: 6px;
      gap: 10px;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
      min-width: 0;
    }
    .app-icon {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: linear-gradient(135deg, #0284C7, #2563EB);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 14px;
      color: #FFF;
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.35);
      flex-shrink: 0;
    }
    .app-titles {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }
    .app-name {
      font-size: 20px;
      font-weight: 700;
      color: var(--text-primary);
      line-height: 1.2;
      font-family: 'Space Grotesk', sans-serif;
      letter-spacing: -0.02em;
    }
    .app-subtitle {
      font-size: 11px;
      color: var(--accent);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    .fav-counter-btn {
      background: var(--chip-bg);
      border: 1px solid var(--border-color);
      border-radius: 18px;
      padding: 6px 12px;
      font-size: 13px;
      font-weight: 700;
      color: var(--accent-orange);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: all 0.15s;
    }
    .fav-counter-btn:hover { background: #1B2F52; }
    .btn-download-apk {
      background: linear-gradient(135deg, #2563EB, #1D4ED8);
      color: #FFF;
      text-decoration: none;
      font-size: 11.5px;
      font-weight: 600;
      padding: 7px 12px;
      border-radius: 18px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
      white-space: nowrap;
    }
    .btn-download-apk:active { transform: scale(0.96); }

    /* Search Box matching bg_search */
    .search-box {
      background: var(--bg-search);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      display: flex;
      align-items: center;
      padding: 0 12px;
      margin-bottom: 10px;
      height: 48px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .search-box:focus-within {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15);
    }
    .search-icon {
      font-size: 16px;
      color: var(--text-muted);
      margin-right: 8px;
    }
    .search-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-primary);
      font-size: 14px;
      font-family: inherit;
    }
    .search-input::placeholder { color: var(--text-muted); }
    .btn-clear {
      background: none;
      border: none;
      color: var(--text-secondary);
      font-size: 16px;
      cursor: pointer;
      padding: 6px;
      display: none;
    }

    /* Categories Horizontal Scroll Bar matching activity_main.xml */
    .scroll-row {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
      margin-bottom: 8px;
      padding-bottom: 2px;
    }
    .scroll-row::-webkit-scrollbar { display: none; }
    .chip-btn {
      background: var(--chip-bg);
      color: var(--text-secondary);
      border: 1px solid var(--border-color);
      padding: 6px 14px;
      border-radius: 18px;
      font-size: 11px;
      font-weight: 500;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.15s;
    }
    .chip-btn.active {
      background: var(--chip-active-bg);
      color: var(--text-primary);
      border-color: var(--chip-active-bg);
      font-weight: 700;
      box-shadow: 0 2px 8px rgba(2, 132, 199, 0.35);
    }
    .chip-fav { color: var(--accent-orange); }

    /* Brands Quick Bar matching activity_main.xml */
    .brand-row {
      display: flex;
      gap: 4px;
      overflow-x: auto;
      scrollbar-width: none;
      margin-bottom: 10px;
      padding-bottom: 2px;
    }
    .brand-row::-webkit-scrollbar { display: none; }
    .brand-btn {
      background: var(--chip-bg);
      color: var(--text-secondary);
      border: 1px solid var(--border-color);
      padding: 4px 10px;
      border-radius: 14px;
      font-size: 10px;
      font-weight: 500;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.15s;
    }
    .brand-btn.active {
      background: var(--chip-active-bg);
      color: var(--text-primary);
      border-color: var(--chip-active-bg);
      font-weight: 700;
    }

    /* Count Header matching tv_count */
    .count-header {
      font-size: 12px;
      color: var(--text-secondary);
      margin-bottom: 8px;
      padding-left: 4px;
    }

    /* List of Pinouts matching item_pinout.xml */
    .pinout-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex: 1;
    }
    .item-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 12px;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, transform 0.1s;
    }
    .item-card:hover {
      background: #142544;
      border-color: rgba(56, 189, 248, 0.35);
      transform: translateY(-1px);
    }
    .item-card:active { transform: scale(0.99); }
    .item-top {
      display: flex;
      align-items: center;
      margin-bottom: 6px;
      gap: 6px;
    }
    .item-badge {
      background: #162644;
      border: 1px solid rgba(56, 189, 248, 0.25);
      color: var(--primary);
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.02em;
    }
    .badge-cfpm { color: #FBBF24; border-color: rgba(245, 158, 11, 0.3); background: rgba(245, 158, 11, 0.12); }
    .badge-ktag { color: #60A5FA; border-color: rgba(59, 130, 246, 0.3); background: rgba(59, 130, 246, 0.12); }
    .badge-bench { color: #38BDF8; border-color: rgba(56, 189, 248, 0.3); background: rgba(56, 189, 248, 0.12); }
    .badge-boot { color: #C084FC; border-color: rgba(168, 85, 247, 0.3); background: rgba(168, 85, 247, 0.12); }
    .badge-hex { color: #34D399; border-color: rgba(16, 185, 129, 0.3); background: rgba(16, 185, 129, 0.12); }
    .badge-dm { color: #F472B6; border-color: rgba(236, 72, 153, 0.3); background: rgba(236, 72, 153, 0.12); }

    .item-mcu-badge {
      background: #162644;
      border: 1px solid rgba(14, 165, 233, 0.25);
      color: var(--accent);
      padding: 3px 6px;
      border-radius: 6px;
      font-size: 10px;
      font-family: 'IBM Plex Mono', monospace;
    }
    .item-spacer { flex: 1; }
    .item-img-count {
      font-size: 11px;
      color: var(--text-muted);
      margin-right: 4px;
    }
    .item-fav-btn {
      color: var(--accent-orange);
      font-size: 18px;
      padding: 2px 6px;
      cursor: pointer;
      line-height: 1;
      user-select: none;
      transition: transform 0.15s;
    }
    .item-fav-btn:hover { transform: scale(1.25); }
    .item-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-primary);
      line-height: 1.35;
      margin-bottom: 4px;
    }
    .item-summary {
      font-size: 12px;
      color: var(--text-secondary);
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .load-more-btn {
      background: var(--chip-bg);
      border: 1px solid var(--border-color);
      color: var(--primary);
      padding: 12px 20px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      margin: 16px 0 30px;
      text-align: center;
      transition: all 0.15s;
    }
    .load-more-btn:hover { background: #1B2F52; }

    /* Detail Screen matching activity_detail.xml */
    #detailScreen {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: var(--bg-dark);
      flex-direction: column;
    }
    #detailScreen.open { display: flex; }

    /* Top Action Bar matching activity_detail.xml */
    .detail-action-bar {
      background: var(--bg-card);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      padding: 10px 12px;
      gap: 10px;
    }
    .btn-detail-back {
      width: 38px;
      height: 38px;
      background: var(--chip-bg);
      border: 1px solid var(--border-color);
      border-radius: 19px;
      color: var(--text-primary);
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }
    .detail-header-info {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
    }
    .detail-main-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .detail-sub-category {
      font-size: 11px;
      color: var(--primary);
    }
    .btn-detail-fav {
      width: 38px;
      height: 38px;
      background: var(--chip-bg);
      border: 1px solid var(--border-color);
      border-radius: 19px;
      color: var(--accent-orange);
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }

    /* Quick Pin Color Legend Bar matching activity_detail.xml */
    .pin-legend-bar {
      background: #162032;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      display: flex;
      align-items: center;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
      padding: 6px 10px;
    }
    .pin-legend-bar::-webkit-scrollbar { display: none; }
    .legend-title {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      white-space: nowrap;
      margin-right: 2px;
    }
    .tag-pin {
      padding: 2px 7px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 700;
      white-space: nowrap;
    }
    .tag-vcc { background: #EF4444; color: #FFF; }
    .tag-gnd { background: #000000; color: #FFF; border: 1px solid rgba(255, 255, 255, 0.2); }
    .tag-kline { background: #EAB308; color: #000; }
    .tag-canh { background: #38BDF8; color: #000; }
    .tag-canl { background: #22C55E; color: #FFF; }
    .tag-boot { background: #A855F7; color: #FFF; }
    .tag-gpt { background: #EC4899; color: #FFF; }

    /* WebView iframe Container */
    .detail-content-frame {
      flex: 1;
      position: relative;
      background: var(--bg-dark);
    }
    .detail-iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: var(--bg-dark);
    }
    .detail-spinner {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 44px;
      height: 44px;
      border: 3px solid rgba(56, 189, 248, 0.2);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: translate(-50%, -50%) rotate(360deg); } }
  </style>
</head>
<body>

  <div id="appContainer">

  <script>
    (function() {
      "use strict";

      let allData = [];
      let filteredData = [];
      let currentCategory = 'ALL';
      let currentBrand = 'ALL';
      let currentQuery = '';
      let renderedCount = 0;
      const BATCH_SIZE = 60;
      let favorites = new Set(JSON.parse(localStorage.getItem('pinout2_favs') || '[]'));
      let currentDetailItem = null;

      // DOM elements
      const searchInput = document.getElementById('searchInput');
      const btnClear = document.getElementById('btnClear');
      const countHeader = document.getElementById('countHeader');
      const pinoutList = document.getElementById('pinoutList');
      const loadMoreBtn = document.getElementById('loadMoreBtn');
      const favCounterBtn = document.getElementById('favCounterBtn');
      const categoryBar = document.getElementById('categoryBar');
      const brandBar = document.getElementById('brandBar');

      const detailScreen = document.getElementById('detailScreen');
      const btnDetailBack = document.getElementById('btnDetailBack');
      const detailTitle = document.getElementById('detailTitle');
      const detailCategory = document.getElementById('detailCategory');
      const btnDetailFav = document.getElementById('btnDetailFav');
      const detailIframe = document.getElementById('detailIframe');
      const detailSpinner = document.getElementById('detailSpinner');

      function updateFavCounter() {
        favCounterBtn.textContent = `★ ${favorites.size}`;
        localStorage.setItem('pinout2_favs', JSON.stringify(Array.from(favorites)));
      }
      updateFavCounter();

      function getRepo(source, path) {
        if (path) {
          const p = path.toLowerCase();
          if (p.startsWith('assets/images') || p.includes('assets/images')) return 'pin-out-cfpm-gbe-auto-237';
          if (p.startsWith('bsl_bootmode_tricore') || p.startsWith('pcmktm_bench_module71') || p.startsWith('cfpm_pinouts')) return 'pin-out-2-bench-bsl';
          if (p.startsWith('dm_bosch_siemens_marelli') || p.startsWith('hexportal_ecu_connections')) return 'pin-out-2-hexportal-dm';
          if (p.startsWith('ktag_instruction')) return 'pin-out-2-ktag';
        }
        if (source === 'bsl_bootmode_tricore' || source === 'pcmktm_bench_module71' || source === 'cfpm_gbe_auto') return 'pin-out-2-bench-bsl';
        if (source === 'dm_bosch_siemens_marelli' || source === 'hexportal_ecu_connections') return 'pin-out-2-hexportal-dm';
        if (source === 'ktag_instruction') return 'pin-out-2-ktag';
        return 'pin-out-2-bench-bsl';
      }

      function getBadgeClass(source) {
        if (source === 'cfpm_gbe_auto') return 'badge-cfpm';
        if (source === 'ktag_instruction') return 'badge-ktag';
        if (source === 'pcmktm_bench_module71') return 'badge-bench';
        if (source === 'bsl_bootmode_tricore') return 'badge-boot';
        if (source === 'hexportal_ecu_connections') return 'badge-hex';
        return 'badge-dm';
      }

      function renderBatch() {
        const nextBatch = filteredData.slice(renderedCount, renderedCount + BATCH_SIZE);
        if (nextBatch.length === 0 && renderedCount === 0) {
          pinoutList.innerHTML = '<div style="text-align:center;padding:50px 20px;color:#64748B;font-size:14px;">Aucun calculateur correspondant trouvé.</div>';
          loadMoreBtn.style.display = 'none';
          return;
        }

        const fragment = document.createDocumentFragment();
        nextBatch.forEach(item => {
          const isFav = favorites.has(item.id);
          const card = document.createElement('div');
          card.className = 'item-card';
          card.innerHTML = `
            <div class="item-top">
              <span class="item-badge ${getBadgeClass(item.source)}">${item.category || 'ECU'}</span>
              ${(item.mcus && item.mcus.length) ? `<span class="item-mcu-badge">${item.mcus[0]}</span>` : ''}
              <div class="item-spacer"></div>
              ${item.images_count > 0 ? `<span class="item-img-count">📷 ${item.images_count}</span>` : ''}
              <span class="item-fav-btn" data-id="${item.id}">${isFav ? '★' : '☆'}</span>
            </div>
            <div class="item-title">${item.title}</div>
            <div class="item-summary">${item.summary || (item.brands ? item.brands.join(', ') : '')}</div>
          `;

          // Card click opens detail
          card.addEventListener('click', (e) => {
            if (e.target.classList.contains('item-fav-btn')) {
              e.stopPropagation();
              toggleFavorite(item.id, e.target);
              return;
            }
            openDetail(item);
          });

          fragment.appendChild(card);
        });

        if (renderedCount === 0) {
          pinoutList.innerHTML = '';
        }
        pinoutList.appendChild(fragment);
        renderedCount += nextBatch.length;

        if (renderedCount < filteredData.length) {
          loadMoreBtn.style.display = 'block';
          loadMoreBtn.textContent = `Afficher plus (${renderedCount} / ${filteredData.length})...`;
        } else {
          loadMoreBtn.style.display = 'none';
        }
      }

      function toggleFavorite(id, starEl) {
        if (favorites.has(id)) {
          favorites.delete(id);
          if (starEl) starEl.textContent = '☆';
        } else {
          favorites.add(id);
          if (starEl) starEl.textContent = '★';
        }
        updateFavCounter();
        if (currentDetailItem && currentDetailItem.id === id) {
          btnDetailFav.textContent = favorites.has(id) ? '★' : '☆';
        }
        if (currentCategory === 'FAVORITES') {
          applyFilters();
        }
      }

      function applyFilters() {
        const q = currentQuery.toLowerCase().trim();
        filteredData = allData.filter(item => {
          // Category filter
          if (currentCategory === 'FAVORITES') {
            if (!favorites.has(item.id)) return false;
          } else if (currentCategory !== 'ALL' && item.source !== currentCategory) {
            return false;
          }

          // Brand filter
          if (currentBrand !== 'ALL') {
            const b = currentBrand.toLowerCase();
            const tags = (item.tags || '').toLowerCase();
            const title = (item.title || '').toLowerCase();
            const brandsStr = (item.brands || []).join(' ').toLowerCase();
            if (!tags.includes(b) && !title.includes(b) && !brandsStr.includes(b)) {
              return false;
            }
          }

          // Query filter
          if (q) {
            const tags = (item.tags || '').toLowerCase();
            const title = (item.title || '').toLowerCase();
            const summary = (item.summary || '').toLowerCase();
            if (!tags.includes(q) && !title.includes(q) && !summary.includes(q)) {
              return false;
            }
          }

          return true;
        });

        countHeader.textContent = `${filteredData.length} calculateur${filteredData.length > 1 ? 's' : ''} trouvé${filteredData.length > 1 ? 's' : ''}`;
        renderedCount = 0;
        renderBatch();
      }

      // Infinite scroll listener
      window.addEventListener('scroll', () => {
        if (window.innerHeight + window.scrollY >= document.body.offsetHeight - 400) {
          if (renderedCount < filteredData.length) {
            renderBatch();
          }
        }
      });
      loadMoreBtn.addEventListener('click', renderBatch);

      function openDetail(item) {
        currentDetailItem = item;
        detailTitle.textContent = item.title;
        detailCategory.textContent = item.category;
        btnDetailFav.textContent = favorites.has(item.id) ? '★' : '☆';
        detailSpinner.style.display = 'block';
        detailScreen.classList.add('open');

        let cleanPath = item.html || '';
        if (cleanPath.startsWith('extracted/')) cleanPath = cleanPath.substring(10);
        while (cleanPath.startsWith('/')) cleanPath = cleanPath.substring(1);

        const repo = getRepo(item.source, cleanPath);
        const encodedPath = cleanPath.split('/').map(encodeURIComponent).join('/');

        // Folder base URL
        const lastSlash = cleanPath.lastIndexOf('/');
        const folderPath = lastSlash !== -1 ? cleanPath.substring(0, lastSlash + 1) : '';
        const encodedFolder = folderPath.split('/').map(encodeURIComponent).join('/');
        const cdnFolderUrl = `https://cdn.jsdelivr.net/gh/tsafackidrissfoedje-wq/${repo}@main/${encodedFolder}`;
        const rawFolderUrl = `https://raw.githubusercontent.com/tsafackidrissfoedje-wq/${repo}/main/${folderPath}`;

        const rawUrl = `https://raw.githubusercontent.com/tsafackidrissfoedje-wq/${repo}/main/${encodedPath}`;
        const cdnUrl = `https://cdn.jsdelivr.net/gh/tsafackidrissfoedje-wq/${repo}@main/${encodedPath}`;

        fetch(cdnUrl)
          .catch(() => fetch(rawUrl))
          .then(res => {
            if (!res.ok) throw new Error('HTTP ' + res.status);
            return res.text();
          })
          .then(html => {
            // Strip any hardcoded base tags or local file:/// base tags
            let processed = html.replace(/<base[^>]*>(?:<\/base>)?/gi, '');

            // Rewrite CFPM images to jsDelivr CDN
            processed = processed.replace(/(?:\.\.\/)+assets\/images\/([^\s"'<>]+)/gi, 'https://cdn.jsdelivr.net/gh/tsafackidrissfoedje-wq/pin-out-cfpm-gbe-auto-237@main/assets/images/$1');
            processed = processed.replace(/assets\/images\/([^\s"'<>]+)/gi, 'https://cdn.jsdelivr.net/gh/tsafackidrissfoedje-wq/pin-out-cfpm-gbe-auto-237@main/assets/images/$1');
            processed = processed.replace(/https:\/\/raw\.githubusercontent\.com\/tsafackidrissfoedje-wq\/pin-out-cfpm-gbe-auto-237\/main\/assets\/images\//gi, 'https://cdn.jsdelivr.net/gh/tsafackidrissfoedje-wq/pin-out-cfpm-gbe-auto-237@main/assets/images/');

            const baseTag = `<base href="${cdnFolderUrl}">`;
            const customDarkCss = `<style>
              body { background:#0B1329 !important; color:#F8FAFC !important; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif !important; padding:16px !important; line-height:1.6 !important; margin:0 !important; }
              h1, h2, h3, h4, h5 { color:#38BDF8 !important; }
              p, span, div, td, th { color:#CBD5E1; }
              img { max-width:100% !important; height:auto !important; border-radius:10px !important; display:block !important; margin:16px auto !important; background:#101E36 !important; box-shadow:0 4px 20px rgba(0,0,0,0.4) !important; border:1px solid rgba(255,255,255,0.08) !important; }
              table { width:100% !important; border-collapse:collapse !important; margin:16px 0 !important; background:#101E36 !important; border-radius:10px !important; overflow:hidden !important; border:1px solid rgba(255,255,255,0.08) !important; }
              th, td { padding:10px 14px !important; border:1px solid rgba(255,255,255,0.06) !important; font-size:13.5px !important; }
              th { background:#162644 !important; color:#38BDF8 !important; font-weight:700 !important; }
              .texter, div[id^='a'], div[id^='b'], div[id^='c'] { display:block !important; }
              a { color:#38BDF8 !important; }
            </style><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">`;

            if (processed.includes('<head>')) {
              processed = processed.replace('<head>', '<head>' + baseTag + customDarkCss);
            } else {
              processed = '<head>' + baseTag + customDarkCss + '</head>' + processed;
            }

            detailIframe.srcdoc = processed;
            detailSpinner.style.display = 'none';
          })
          .catch(err => {
            detailSpinner.style.display = 'none';
            detailIframe.srcdoc = `<body style="background:#0B1329;color:#EF4444;font-family:sans-serif;padding:30px;text-align:center;"><h3>Erreur de chargement</h3><p>Impossible de charger le schéma (${err.message})</p></body>`;
          });
      }

      btnDetailBack.onclick = () => {
        detailScreen.classList.remove('open');
        detailIframe.srcdoc = '';
        currentDetailItem = null;
      };

      btnDetailFav.onclick = () => {
        if (currentDetailItem) {
          toggleFavorite(currentDetailItem.id);
          btnDetailFav.textContent = favorites.has(currentDetailItem.id) ? '★' : '☆';
        }
      };

      favCounterBtn.onclick = () => {
        document.querySelectorAll('.chip-btn').forEach(c => c.classList.remove('active'));
        const favChip = document.querySelector('.chip-fav');
        if (favChip) favChip.classList.add('active');
        currentCategory = 'FAVORITES';
        applyFilters();
      };

      // Search input listener
      searchInput.addEventListener('input', (e) => {
        currentQuery = e.target.value;
        btnClear.style.display = currentQuery ? 'block' : 'none';
        applyFilters();
      });

      btnClear.addEventListener('click', () => {
        searchInput.value = '';
        currentQuery = '';
        btnClear.style.display = 'none';
        applyFilters();
      });

      // Categories chip bar listener
      categoryBar.addEventListener('click', (e) => {
        if (e.target.classList.contains('chip-btn')) {
          document.querySelectorAll('.chip-btn').forEach(c => c.classList.remove('active'));
          e.target.classList.add('active');
          currentCategory = e.target.dataset.cat;
          applyFilters();
        }
      });

      // Brands bar listener
      brandBar.addEventListener('click', (e) => {
        if (e.target.classList.contains('brand-btn')) {
          document.querySelectorAll('.brand-btn').forEach(b => b.classList.remove('active'));
          e.target.classList.add('active');
          currentBrand = e.target.dataset.brand;
          applyFilters();
        }
      });

      // Load Index
      const localUrl = './pinout_app_index.json';
      const cdnIndexUrl = 'https://cdn.jsdelivr.net/gh/tsafackidrissfoedje-wq/pin-out-2-app@main/pinout_app_index.json';
      const rawIndexUrl = 'https://raw.githubusercontent.com/tsafackidrissfoedje-wq/pin-out-2-app/main/pinout_app_index.json';

      fetch(localUrl)
        .catch(() => fetch(cdnIndexUrl))
        .catch(() => fetch(rawIndexUrl))
        .then(res => res.json())
        .then(data => {
          allData = data;
          applyFilters();
        })
        .catch(err => {
          countHeader.textContent = 'Erreur lors du chargement de la base de données : ' + err.message;
        });
    })();
  </script>
</body>
</html>
